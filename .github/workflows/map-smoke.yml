name: Android map smoke test
on:
  push:
    paths:
      - 'map3d.html'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/map-smoke.yml'
  workflow_dispatch:
jobs:
  android-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/map-server.log 2>&1 &
      - run: node tests/map-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-map-screenshot
          path: map-android.png
